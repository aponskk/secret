
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE // BIRTHDAY QUEST</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #080b12;
  --panel: #101521;
  --panel2: #151c2b;
  --border: #273147;
  --text: #e8edf7;
  --muted: #8793a9;
  --blue: #7c9cff;
  --cyan: #62e6e0;
  --green: #7ee0a0;
  --red: #ff7c91;
  --yellow: #ffd37c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #172548 0%, transparent 45%),
    radial-gradient(ellipse at 85% 90%, #162d35 0%, transparent 40%),
    var(--bg);
  font-family: Inter, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .035;
  background-image: linear-gradient(#fff 1px, transparent 1px),
                    linear-gradient(90deg, #fff 1px, transparent 1px);
  background-size: 35px 35px;
}

button, input { font: inherit; }

button { cursor: pointer; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.app {
  max-width: 1280px;
  margin: auto;
  padding: 24px;
  position: relative;
  z-index: 1;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border: 1px solid var(--border);
  background: rgba(16,21,33,.9);
  border-radius: 18px;
  padding: 17px 22px;
  margin-bottom: 18px;
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: "Space Mono", monospace;
  font-weight: 700;
  letter-spacing: .5px;
}

.logo-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: #1d2943;
  border: 1px solid #3c4d73;
  border-radius: 10px;
  color: var(--cyan);
  font-size: 20px;
}

.logo small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  margin-top: 4px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--green);
  font: 12px "Space Mono", monospace;
}

.dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--green);
}

.layout {
  display: grid;
  grid-template-columns: 245px minmax(0,1fr);
  gap: 18px;
}

.sidebar, .main-panel, .side-panel {
  background: rgba(16,21,33,.88);
  border: 1px solid var(--border);
  border-radius: 18px;
  backdrop-filter: blur(12px);
}

.sidebar { padding: 18px; }

.panel-label {
  color: var(--muted);
  font: 10px "Space Mono", monospace;
  letter-spacing: 1.5px;
  margin-bottom: 15px;
  text-transform: uppercase;
}

.tree { display: flex; flex-direction: column; gap: 5px; }

.tree button {
  border: 1px solid transparent;
  background: transparent;
  color: #aeb9ce;
  text-align: left;
  padding: 11px 10px;
  border-radius: 9px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.tree button:hover { background: #1b2539; color: white; }

.tree button.active {
  background: #1b2b4c;
  border-color: #354b78;
  color: var(--cyan);
}

.progress {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.progress-head {
  display: flex;
  justify-content: space-between;
  font: 11px "Space Mono", monospace;
  color: var(--muted);
  margin-bottom: 9px;
}

.progress-head strong { color: var(--cyan); }

.progress-bar {
  height: 5px;
  background: #252d3e;
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  transition: width .5s;
}

.hint-box {
  margin-top: 22px;
  border: 1px solid #34405a;
  border-radius: 12px;
  padding: 12px;
  background: #141d2e;
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}

.hint-box strong { color: var(--yellow); }

.main-panel { min-width: 0; overflow: hidden; }

.pathbar {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font: 11px "Space Mono", monospace;
}

.pathbar span:last-child { color: var(--cyan); }

.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}

.search {
  flex: 1;
  min-width: 0;
  background: #0a0f19;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 13px;
  color: white;
  font-size: 12px;
}

.search:focus { border-color: var(--blue); }

.btn {
  border: 1px solid var(--border);
  background: #1a2335;
  color: #b9c5db;
  border-radius: 9px;
  padding: 10px 14px;
  font-size: 12px;
  transition: .2s;
}

.btn:hover { background: #263550; color: white; }

.btn.primary {
  background: #304a86;
  border-color: #5877c1;
  color: white;
}

.btn.primary:hover { background: #3e5da0; }

.content { padding: 25px; }

.welcome {
  padding: 10px 0 25px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 23px;
}

.eyebrow {
  font: 11px "Space Mono", monospace;
  color: var(--cyan);
  letter-spacing: 2px;
  margin-bottom: 13px;
}

h1 {
  margin: 0 0 13px;
  font-size: clamp(25px, 4vw, 40px);
  letter-spacing: -1.5px;
  line-height: 1.15;
}

.subtitle {
  color: var(--muted);
  max-width: 650px;
  font-size: 13px;
  line-height: 1.8;
}

.stats {
  display: flex;
  gap: 25px;
  margin-top: 22px;
  flex-wrap: wrap;
}

.stat strong {
  display: block;
  font: 22px "Space Mono", monospace;
  color: white;
}

.stat span {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 13px;
  font-size: 12px;
  font-weight: 700;
}

.section-title span {
  font: 10px "Space Mono", monospace;
  color: var(--muted);
  font-weight: 400;
}

.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px,1fr));
  gap: 11px;
}

.file-card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--border);
  background: #121a29;
  border-radius: 12px;
  padding: 17px 13px;
  text-align: left;
  color: white;
  min-height: 128px;
  transition: .2s;
  overflow: hidden;
}

.file-card:hover {
  transform: translateY(-2px);
  background: #1b2940;
  border-color: #536d9f;
}

.file-card:active { transform: translateY(0); }

.file-icon {
  font-size: 28px;
  margin-bottom: 13px;
  display: block;
}

.file-name {
  font-size: 12px;
  font-weight: 600;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.photo-preview {
  display: block;
  max-width: 100%;
  max-height: 400px;
  margin: 15px auto;
  border-radius: 12px;
  object-fit: contain;
}

.file-meta {
  color: var(--muted);
  font: 10px "Space Mono", monospace;
  margin-top: 6px;
}

.file-card .badge {
  position: absolute;
  top: 9px;
  right: 9px;
  font-size: 9px;
  color: var(--yellow);
}

.file-card.locked { opacity: .65; }

.file-card.locked:hover { opacity: 1; }

.empty {
  padding: 40px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.notice {
  margin-top: 18px;
  border: 1px solid #344b70;
  background: #111f36;
  border-radius: 12px;
  padding: 15px;
  color: #a9b9d8;
  font-size: 12px;
  line-height: 1.8;
}

.notice strong { color: var(--cyan); }

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(3,5,10,.82);
  backdrop-filter: blur(8px);
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal-backdrop.show { display: flex; }

.modal {
  width: min(580px,100%);
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid #3c4c6c;
  border-radius: 18px;
  background: #101827;
  box-shadow: 0 25px 100px #0008;
  animation: pop .25s ease;
}

@keyframes pop {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to { opacity: 1; transform: none; }
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 14px; font-weight: 700; }

.close {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  padding: 2px 8px;
}

.close:hover { color: white; }

.modal-body { padding: 25px; }

.modal-icon { font-size: 42px; margin-bottom: 18px; }

.modal-body h2 {
  font-size: 23px;
  margin: 0 0 15px;
  letter-spacing: -.5px;
}

.modal-body p {
  color: #b0bdd2;
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-line;
}

.terminal {
  border: 1px solid #2d4053;
  background: #080f15;
  border-radius: 10px;
  padding: 17px;
  font: 12px/2 "Space Mono", monospace;
  color: #9fe3b5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 18px 0;
}

.modal-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.answer {
  width: 100%;
  background: #080f19;
  border: 1px solid #34445e;
  color: white;
  border-radius: 9px;
  padding: 13px;
  font: 14px "Space Mono", monospace;
  margin-top: 10px;
}

.answer:focus { border-color: var(--cyan); }

.feedback {
  font-size: 12px;
  line-height: 1.7;
  margin-top: 12px;
  color: var(--yellow);
}

.feedback.good { color: var(--green); }

.fake-cert {
  text-align: center;
  padding: 22px 10px;
  border: 1px solid #5d4b70;
  border-radius: 12px;
  background: linear-gradient(135deg,#1c1730,#111b30);
}

.fake-cert .big { font-size: 40px; }

.fake-cert h3 {
  font: 700 20px "Space Mono", monospace;
  color: #d3b7ff;
  margin: 12px 0;
}

.fake-cert p { color: #b2a2c9; }

.real-cert {
  text-align: center;
  border: 1px solid #6e6240;
  background:
    radial-gradient(circle at 50% 0%,#403a20,transparent 70%),
    #171a20;
  padding: 35px 22px;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

.real-cert::before {
  content: "✦  ✧  ✦  ✧  ✦";
  display: block;
  color: #e4c77e;
  font-size: 23px;
  letter-spacing: 8px;
  margin-bottom: 18px;
}

.real-cert h2 {
  font: 700 27px "Space Mono",monospace;
  color: #f0d68e;
  letter-spacing: 1px;
}

.real-cert h3 {
  color: white;
  font-size: 20px;
  margin: 24px 0;
}

.real-cert p { color: #c8c1ad; }

.real-cert .small {
  font: 10px "Space Mono",monospace;
  color: #958a6c;
  margin-top: 28px;
}

.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 30;
  overflow: hidden;
}

.confetti span {
  position: absolute;
  top: -20px;
  width: 8px;
  height: 14px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

.toast {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 20;
  background: #19253a;
  border: 1px solid #3e5275;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 12px;
  color: white;
  box-shadow: 0 10px 30px #0005;
  animation: pop .2s ease;
  max-width: min(360px,calc(100% - 40px));
}

.toast.good { border-color: #4e916b; }

.mobile-back { display: none; }

@media(max-width:800px) {
  .app { padding: 12px; }
  .topbar { padding: 14px; }
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.mobile-open { display: block; }
  .mobile-back { display: inline-flex; }
  .content { padding: 18px; }
  .file-grid { grid-template-columns: repeat(auto-fill,minmax(125px,1fr)); }
  .toolbar { padding: 12px; }
  .status { display: none; }
  h1 { font-size: 28px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="logo">

      <div>
        BIRTHDAY ARCHIVE
        <small>CLASSIFIED // PERSONAL EDITION</small>
      </div>
    </div>
    <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="panel-label">File system</div>
      <div class="tree" id="tree"></div>

      <div class="progress">
        <div class="progress-head">
          <span>MISSION PROGRESS</span>
          <strong id="progressText">0%</strong>

        <div class="progress-bar">

        <div style="margin-top:10px;font-size:11px;color:var(--muted)">

      </div>
    </aside>

    <main class="main-panel">
      <div class="pathbar">
        <span>HOME</span><span>/</span><span id="pathCurrent">BIRTHDAY_ARCHIVE</span>
      </div>

      <div class="toolbar">
        <button class="btn mobile-back" id="menuBtn" onclick="toggleMenu()">☰</button>
        <input class="search" id="search" placeholder="Поиск файлов..." oninput="render()">
        <button class="btn" onclick="goHome()">⌂ Главная</button>
      </div>

      <div class="content" id="content"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">FILE VIEWER</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toastContainer"></div>
<div class="confetti" id="confetti"></div>

// ==========================================
// СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ==========================================

let current = "root";
let found = new Set();
let unlocked = false;
let finalUnlocked = false;
let wrongAttempts = 0;
let menuOpen = false;

const totalDiscoveries = 10;

// ==========================================
// РЕНДЕР
// ==========================================

function render() {
  const folder = archive[current];
  const search = document.getElementById("search").value.toLowerCase().trim();

  document.getElementById("pathCurrent").textContent = folder.name;
  renderTree();

  let items = folder.items || [];

  if (search) {
    items = Object.keys(archive).filter(id => {
      const f = archive[id];
      return f.name.toLowerCase().includes(search);
    });
  }

  const content = document.getElementById("content");

  if (current === "root" && !search) {
    content.innerHTML = `
      <section class="welcome">
        <div class="eyebrow">/// INCOMING TRANSMISSION</div>
        <h1>С днём рождения<br>${CONFIG.birthdayName} 🎂</h1>
        <div class="subtitle">
          Добро пожаловать в персональный архив.
          Твой подарок был помещён в систему, но доступ к нему временно ограничен.
          <br><br>
          Исследуй папки, открывай файлы, находи подсказки.
          Не все документы настоящие. Не все предупреждения стоит игнорировать.
        </div>
        <div class="stats">
          <div class="stat"><strong>06</strong><span>Разделов</span></div>
          <div class="stat"><strong>∞</strong><span>Секретов</span></div>
          <div class="stat"><strong>01</strong><span>Настоящий подарок</span></div>
        </div>
      </section>
    `;
  } else {
    content.innerHTML = `
      <div class="welcome" style="padding-bottom:18px">
        <div class="eyebrow">/// DIRECTORY</div>
        <h1 style="font-size:24px">${folder.icon} ${folder.name}</h1>
        <div class="subtitle">${folder.desc || "Содержимое раздела"}</div>
      </div>
    `;
  }

  const sectionTitle = document.createElement("div");
  sectionTitle.className = "section-title";
  sectionTitle.innerHTML = `<span style="color:var(--text);font:700 12px Inter">${search ? "Результаты поиска" : "Содержимое папки"}</span><span>${items.length} ITEMS</span>`;
  content.appendChild(sectionTitle);

  const grid = document.createElement("div");
  grid.className = "file-grid";

  if (!items.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Пусто.<br><br>Здесь действительно ничего нет.</div>`;
  } else {
    items.forEach(id => {
      const f = archive[id];
      const card = document.createElement("button");
      card.className = "file-card" + (f.kind === "locked" ? " locked" : "");
      card.onclick = () => openItem(id);

      const isFound = found.has(id);
      card.innerHTML = `
        <span class="file-icon">${f.icon}</span>
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${f.type === "folder" ? "FOLDER" : "FILE"}</div>
        ${isFound ? '<span class="badge">✓ FOUND</span>' : ""}
      `;
      grid.appendChild(card);
    });
  }

  content.appendChild(grid);

  if (current === "root" && !search) {
    const notice = document.createElement("div");
    notice.className = "notice";
    notice.innerHTML = `<strong>▸ SYSTEM MESSAGE</strong><br>
      Архив содержит ${Object.keys(archive).length} объектов.
      Некоторые файлы могут быть связаны между собой.
      <br>Рекомендуется внимательно читать названия документов.`;
    content.appendChild(notice);
  }

  updateProgress();
}

function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";

  const root = archive.root;
  const rootBtn = document.createElement("button");
  rootBtn.className = current === "root" ? "active" : "";
  rootBtn.innerHTML = `🎂 <span>С ДНЁМ РОЖДЕНИЯ</span>`;
  rootBtn.onclick = () => navigate("root");
  tree.appendChild(rootBtn);

  root.items.forEach(id => {
    const f = archive[id];
    const btn = document.createElement("button");
    btn.className = current === id ? "active" : "";
    btn.innerHTML = `${f.icon} <span>${f.name.replace(/^\d+_/,"")}</span>`;
    btn.onclick = () => navigate(id);
    tree.appendChild(btn);
  });
}

function updateProgress() {
  const percent = Math.round(found.size / totalDiscoveries * 100);
  document.getElementById("progressText").textContent = percent + "%";
  document.getElementById("progressFill").style.width = percent + "%";
  document.getElementById("foundText").textContent = found.size;
  document.getElementById("totalText").textContent = totalDiscoveries;
}

function navigate(id) {
  current = id;
  document.getElementById("search").value = "";
  render();
}

function goHome() {
  navigate("root");
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById("sidebar").classList.toggle("mobile-open", menuOpen);
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("show");
}

function backdropClose(e) {
  if (e.target.id === "modalBackdrop") closeModal();
}

function showModal(title, html) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalBackdrop").classList.add("show");
}

function markFound(id) {
  if (!found.has(id)) {
    found.add(id);
    updateProgress();
  }
}

function openItem(id) {
  const f = archive[id];

  if (f.type === "folder") {
    navigate(id);
    return;
  }

  markFound(id);
  openFile(id, f);
}

// ==========================================
// КОДОВЫЕ ЗАМКИ
// ==========================================

function checkCode() {
  const input = document.getElementById("codeInput");
  const feedback = document.getElementById("codeFeedback");

  if (!input || !feedback) return;

  if (input.value.trim() === CONFIG.finalCode) {
    unlocked = true;
    feedback.className = "feedback good";
    feedback.textContent = "✓ Код принят. Доступ разрешён.";
    markFound("securityFile");
    toast("Система безопасности отключена.", true);

    setTimeout(() => {
      closeModal();
      navigate("final");
    }, 1000);
  } else {
    wrongAttempts++;
    feedback.className = "feedback";
    feedback.textContent = wrongAttempts >= 3
      ? "Неверный код. Подсказка: ищи числа в досье агентов."
      : "Неверный код. Попробуй ещё раз.";
  }
}

function checkFinal() {
  const input = document.getElementById("finalInput");
  const feedback = document.getElementById("finalFeedback");

  if (!input || !feedback) return;

  if (input.value.trim() === CONFIG.finalSafeCode) {
    finalUnlocked = true;
    feedback.className = "feedback good";
    feedback.textContent = "✓ СЕЙФ ОТКРЫТ. ПОДАРОК НАЙДЕН.";
    markFound("finalSafe");
    toast("Операция завершена!", true);

    setTimeout(() => {
      closeModal();
      showCertificate();
    }, 900);
  } else {
    feedback.className = "feedback";
    feedback.textContent = "Код неверный. Проверь найденные подсказки.";
  }
}

function pressDanger() {
  closeModal();

  document.body.style.filter = "hue-rotate(100deg)";
  toast("Система обнаружила любопытство.", false);

  setTimeout(() => {
    document.body.style.filter = "";
    showModal("SYSTEM ALERT", `
      <div class="modal-icon">🚨</div>
      <h2>Ты нажала.</h2>
      <p>И ничего не произошло.

Потому что это просто сайт.

Но теперь ты знаешь, что любопытство — опасная вещь.</p>
      <div class="terminal">DANGER BUTTON PRESSED
NO ACTUAL DANGER DETECTED
CONGRATULATIONS</div>
    `);
  }, 500);
}

// ==========================================
// ФИНАЛ
// ==========================================

function showCertificate() {
  showModal("FINAL GIFT // ACCESS GRANTED", `
    <div class="real-cert">
      <h2>СЕРТИФИКАТ</h2>
      <p>Настоящим подтверждается, что</p>
      <h3>${CONFIG.birthdayName}</h3>
      <p>успешно прошла секретную операцию<br>и получил настоящий подарок.</p>
      <h3 style="font-size:18px">${CONFIG.certificateTitle}</h3>
      <p>${CONFIG.certificateText}</p>
      <p style="margin-top:25px">С любовью и уважением,<br>${CONFIG.senderName}</p>
      <div class="small">ARCHIVE SYSTEM // MISSION COMPLETE</div>
    </div>
    ${CONFIG.certificateLink ? `
      <div class="modal-actions">
        <button class="btn primary" onclick="window.open(CONFIG.certificateLink,'_blank')">Открыть настоящий сертификат →</button>
      </div>
    ` : ""}
  `);

  launchConfetti();

  // Автоматически скачиваем настоящий PDF после открытия сейфа.
  setTimeout(() => {
    const link = document.createElement("a");
    link.href = "certificate.pdf";
    link.download = "Настоящий_сертификат.pdf";
    document.body.appendChild(link);
    link.click();
    link.remove();
  }, 400);
}

function launchConfetti() {
  const container = document.getElementById("confetti");
  container.innerHTML = "";

  const colors = ["#7c9cff","#62e6e0","#7ee0a0","#ffd37c","#ff7c91"];

  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("span");
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 1.5 + "s";
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(piece);
  }

  setTimeout(() => container.innerHTML = "", 4500);
}

// ==========================================
// УВЕДОМЛЕНИЯ
// ==========================================

function toast(message, good = false) {
  const container = document.getElementById("toastContainer");
  const el = document.createElement("div");
  el.className = "toast" + (good ? " good" : "");
  el.textContent = message;
  container.appendChild(el);

  setTimeout(() => el.remove(), 3500);
}

// ==========================================
// ЗАПУСК
// ==========================================

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

render();
</script>
